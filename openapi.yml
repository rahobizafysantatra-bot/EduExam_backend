openapi: 3.0.3

info:
  title: Exam Hub API (EduExam)
  description: |
    API for the "Exam Hub" multiple-choice exam platform.
    Roles:
      - ADMIN: manages students, courses, exams, questions, and views results.
      - STUDENT: takes available exams and views their results.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Development

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Students
  - name: Courses
  - name: Exams
  - name: Questions
  - name: Results
  - name: MyExams

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login (admin or student)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials or account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students:
    get:
      tags: [Students]
      summary: List students
      description: Admin only.
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Students]
      summary: Create a student account
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'

    put:
      tags: [Students]
      summary: Update a student (name, email, reset password)
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentRequest'
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Students]
      summary: Deactivate a student
      description: Admin only. Never physically deletes the record.
      responses:
        '204':
          description: Student deactivated
        '404': { $ref: '#/components/responses/NotFound' }

  /courses:
    get:
      tags: [Courses]
      summary: List courses
      description: Admin only.
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'

    post:
      tags: [Courses]
      summary: Create a course
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Course code already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    put:
      tags: [Courses]
      summary: Update a course
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Courses]
      summary: Delete a course
      description: Admin only.
      responses:
        '204':
          description: Course deleted
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Course has exams, deletion rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exams:
    get:
      tags: [Exams]
      summary: List exams
      description: Admin only.
      parameters:
        - name: courseId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exam'

    post:
      tags: [Exams]
      summary: Create an exam
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamRequest'
      responses:
        '201':
          description: Exam created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '400': { $ref: '#/components/responses/BadRequest' }

  /exams/{examId}:
    parameters:
      - $ref: '#/components/parameters/ExamId'

    get:
      tags: [Exams]
      summary: Get exam details
      description: Admin only.
      responses:
        '200':
          description: Exam details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExamDetail'
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Exams]
      summary: Update an exam
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExamRequest'
      responses:
        '200':
          description: Exam updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Exams]
      summary: Delete an exam
      description: Admin only.
      responses:
        '204':
          description: Exam deleted
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Exam has attempts, deletion rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exams/{examId}/questions:
    parameters:
      - $ref: '#/components/parameters/ExamId'

    get:
      tags: [Questions]
      summary: List an exam's questions
      description: Admin only.
      responses:
        '200':
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminQuestion'

    post:
      tags: [Questions]
      summary: Add a question to an exam
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Exam already has attempts, questions are locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'

    put:
      tags: [Questions]
      summary: Update a question
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Exam already has attempts, questions are locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Questions]
      summary: Delete a question
      description: Admin only.
      responses:
        '204':
          description: Question deleted
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Exam already has attempts, questions are locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exams/{examId}/results:
    parameters:
      - $ref: '#/components/parameters/ExamId'

    get:
      tags: [Results]
      summary: Get exam results
      description: Admin only.
      responses:
        '200':
          description: Exam results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultsResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /my/exams:
    get:
      tags: [MyExams]
      summary: Get available exams for the logged-in student
      responses:
        '200':
          description: Available exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentExam'

  /my/exams/{examId}:
    parameters:
      - $ref: '#/components/parameters/ExamId'

    get:
      tags: [MyExams]
      summary: Get exam content to take
      responses:
        '200':
          description: Exam content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentExamDetail'
        '403':
          description: Exam window is closed, or exam already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }

  /my/exams/{examId}/submit:
    parameters:
      - $ref: '#/components/parameters/ExamId'

    post:
      tags: [MyExams]
      summary: Submit exam answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitExamRequest'
      responses:
        '200':
          description: Score calculated and full correction returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Exam window is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Exam already taken by this student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /my/results:
    get:
      tags: [MyExams]
      summary: Get the logged-in student's result history
      responses:
        '200':
          description: Result history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyResultSummary'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string

    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string

    ExamId:
      name: examId
      in: path
      required: true
      schema:
        type: string

    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, STUDENT]

    Student:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time

    CreateStudentRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    UpdateStudentRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    Course:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
          example: PROG2
        name:
          type: string
        description:
          type: string

    CreateCourseRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string

    UpdateCourseRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string

    CreateExamRequest:
      type: object
      required: [courseId, title, startDate, endDate]
      properties:
        courseId:
          type: string
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    UpdateExamRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    Exam:
      type: object
      properties:
        id:
          type: string
        courseId:
          type: string
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    AdminExamDetail:
      allOf:
        - $ref: '#/components/schemas/Exam'
        - type: object
          properties:
            questions:
              type: array
              items:
                $ref: '#/components/schemas/AdminQuestion'
            attemptsCount:
              type: integer

    ChoiceInput:
      type: object
      required: [text, isCorrect]
      properties:
        text:
          type: string
        isCorrect:
          type: boolean

    AdminChoice:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean

    StudentChoice:
      type: object
      properties:
        id:
          type: string
        text:
          type: string

    CreateQuestionRequest:
      type: object
      required: [statement, points, choices]
      properties:
        statement:
          type: string
        points:
          type: number
          minimum: 0
        choices:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: '#/components/schemas/ChoiceInput'

    AdminQuestion:
      type: object
      properties:
        id:
          type: string
        examId:
          type: string
        statement:
          type: string
        points:
          type: number
        choices:
          type: array
          items:
            $ref: '#/components/schemas/AdminChoice'

    StudentQuestion:
      type: object
      properties:
        id:
          type: string
        statement:
          type: string
        points:
          type: number
        choices:
          type: array
          items:
            $ref: '#/components/schemas/StudentChoice'

    StudentExam:
      allOf:
        - $ref: '#/components/schemas/Exam'
        - type: object
          properties:
            courseCode:
              type: string

    StudentExamDetail:
      allOf:
        - $ref: '#/components/schemas/Exam'
        - type: object
          properties:
            questions:
              type: array
              items:
                $ref: '#/components/schemas/StudentQuestion'

    SubmitExamRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, choiceId]
            properties:
              questionId:
                type: string
              choiceId:
                type: string

    QuestionCorrection:
      type: object
      properties:
        questionId:
          type: string
        statement:
          type: string
        selectedChoiceId:
          type: string
          nullable: true
        correctChoiceId:
          type: string
        isCorrect:
          type: boolean
        pointsEarned:
          type: number

    ExamResult:
      type: object
      properties:
        attemptId:
          type: string
        examId:
          type: string
        examTitle:
          type: string
        courseCode:
          type: string
        score:
          type: number
        maxScore:
          type: number
        submittedAt:
          type: string
          format: date-time
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/QuestionCorrection'

    MyResultSummary:
      type: object
      properties:
        id:
          type: string
        examId:
          type: string
        examTitle:
          type: string
        courseCode:
          type: string
        score:
          type: number
        submittedAt:
          type: string
          format: date-time

    StudentResultSummary:
      type: object
      properties:
        studentId:
          type: string
        studentName:
          type: string
        score:
          type: number
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true

    ExamResultsResponse:
      type: object
      properties:
        examId:
          type: string
        average:
          type: number
        attemptsCount:
          type: integer
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentResultSummary'

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Resource not found"

  responses:
    BadRequest:
      description: Invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Access not authorized for this role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'